<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008200"><title>Prospeção</title>
<style>
:root{--p:#008200;--bg:#f4f7f5;--card:#fff;--tx:#0b0c10;--mu:#657786;--bd:#e1e8ed;--bl:#2563eb;--blb:#eff6ff;--gn:#008200;--gnb:#e6f6e6;--rd:#ff2b2b;--rdb:#fff5f5;--am:#b45309;--amb:#fef3e2;--pu:#7c3aed;--pub:#f3eeff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1412;--card:#1a211e;--tx:#eef2f0;--mu:#9aa8a2;--bd:#2b3632;--blb:#16233f;--gnb:#12301a;--rdb:#3a1616;--amb:#3a2a12;--pub:#2a1f45}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 12px 40px}
.w{max-width:720px;margin:0 auto}button,select,input,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:18px;margin:0;flex:1}.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 13px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;color:var(--tx)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}.btn.gn{background:var(--gnb);color:var(--gn)}.btn.rd{background:var(--rdb);color:var(--rd)}.btn.am{background:var(--amb);color:var(--am)}
.tabs{display:flex;gap:6px;margin:4px 0 10px}.tabs button{flex:1}.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.nav b{font-size:14px}
.dias{display:flex;gap:6px;margin:8px 0}.dia{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 2px;text-align:center;font-weight:700;font-size:12px;cursor:pointer}.dia small{display:block;color:var(--mu);font-weight:500}.dia.on{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.fil input,.fil select{flex:1;min-width:120px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px}
.ed{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.c{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}.c.open{border-color:var(--bl)}
.ct{display:flex;justify-content:space-between;gap:8px;cursor:pointer}.nm{font-weight:700;font-size:15px}.sb{color:var(--mu);font-size:13px;margin-top:2px}
.bg{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--bd);color:var(--mu)}
.t-Prospeção{background:var(--blb);color:var(--bl)}.t-Reconquista{background:var(--amb);color:var(--am)}.t-Execução{background:var(--pub);color:var(--pu)}
.e-feita,.e-conquistado{background:var(--gnb);color:var(--gn)}.e-falhada,.e-novavisita{background:var(--blb);color:var(--bl)}.e-recusou{background:var(--rdb);color:var(--rd)}.e-planeada{background:var(--bd);color:var(--tx)}
.col{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dt{display:none;margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}.c.open .dt{display:block}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px}.g span{color:var(--mu);display:block}.g b{font-weight:600;word-break:break-word}
textarea{width:100%;margin-top:10px;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--card)}
.ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.vz{color:var(--mu);text-align:center;padding:30px 8px}
.lock-overlay{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}.lock-overlay[hidden]{display:none}
.lock-box{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;text-align:center}.lock-titulo{margin:0 0 22px;color:var(--mu);font-size:.95rem;font-weight:400}
.lock-dots{display:flex;gap:18px;margin-bottom:8px}.lock-dots.erro{animation:abanarPin .3s}.lock-dot{width:15px;height:15px;border-radius:50%;border:2px solid #9ca3af;transition:background .12s,border-color .12s}
.lock-dot.cheio{background:var(--tx);border-color:var(--tx)}.lock-dots.erro .lock-dot{border-color:#dc2626;background:#dc2626}
.lock-erro-msg{color:#dc2626;font-size:.8rem;font-weight:700;min-height:18px;margin-bottom:10px}
.lock-link{margin-top:18px;background:none;border:0;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--mu);text-decoration:underline;padding:6px 10px}.lock-link:disabled{visibility:hidden}
.lock-passo{width:100%;display:flex;flex-direction:column;align-items:center}.lock-passo[hidden]{display:none}
.lock-gestores{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;width:100%}.lock-gestor{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx);touch-action:manipulation}
.lock-gestor:active .lock-gestor-foto{transform:scale(.94)}.lock-gestor-foto{width:76px;height:76px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:transform .08s;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;color:#6b7280}
.lock-gestor-foto img{width:100%;height:100%;object-fit:cover;display:block}.lock-gestor-nome{font-size:.78rem;font-weight:600;line-height:1.2;max-width:92px}
.lock-quem{display:flex;align-items:center;gap:10px;margin-bottom:16px;background:none;border:0;cursor:pointer;color:var(--tx)}.lock-quem .lock-gestor-foto{width:46px;height:46px;font-size:.95rem}
.lock-quem-nome{font-size:.9rem;font-weight:700;text-align:left}.lock-quem-trocar{display:block;font-size:.72rem;font-weight:600;color:var(--mu)}
.lock-teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}.lock-tecla{height:62px;border-radius:16px;border:1px solid #e5e7eb;background:#fff;color:#111827;font-family:Arial,Helvetica,sans-serif;font-size:1.6rem;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .08s,background .08s;touch-action:manipulation}
.lock-tecla:active{transform:scale(.95);background:#f3f4f6}.lock-tecla.vazia{visibility:hidden}.lock-tecla.apagar{background:transparent;border-color:transparent;box-shadow:none;color:#6b7280;display:flex;align-items:center;justify-content:center}.lock-tecla.apagar svg{width:24px;height:24px}
@keyframes abanarPin{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-color-scheme:dark){.lock-tecla:not(.apagar),.lock-gestor-foto{background:var(--card);color:var(--tx);border-color:var(--bd)}}
.mt{margin-top:10px;border:1px dashed var(--bd);border-radius:12px;padding:10px}.mh{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:8px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mi{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center}.mi b{display:block;font-size:18px}.mi span{font-size:11px;color:var(--mu)}.mx{font-size:12px;color:var(--mu);margin-top:8px}
.kps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}.kp span{display:block;font-size:11px;color:var(--mu);margin-bottom:4px}.kp b{font-size:17px;font-weight:700}.kp b.q{color:var(--rd)}.kp b.m{color:var(--am)}.kp b.f{color:var(--bl)}
.sec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin:16px 0 4px}.li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.li:last-child{border-bottom:0}.li span{color:var(--mu);flex:none}.li b{text-align:right;font-weight:600;word-break:break-word}.li a{color:var(--bl);text-decoration:none}
.mt{margin:0;padding:0;border:0}.ac3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.ac3 .btn{padding:12px 4px;text-align:center}.btn.bl{background:var(--blb);color:var(--bl)}.btn.gs{background:var(--gn);border-color:var(--gn);color:#fff}
</style></head><body><div class="w">
<div class="lock-overlay" id="lg" hidden><div class="lock-box">
<div class="lock-passo" id="lgPassoG"><p class="lock-titulo">Quem és tu? Toca na tua foto</p><div class="lock-gestores" id="lgGest"></div><div class="lock-erro-msg" id="lgErroG" style="margin-top:14px"></div></div>
<div class="lock-passo" id="lgPassoP" hidden><button type="button" class="lock-quem" onclick="lgVoltar()" aria-label="Trocar de utilizador"><span class="lock-gestor-foto" id="lgFoto"></span><span class="lock-quem-nome"><span id="lgQuem"></span><span class="lock-quem-trocar">Não és tu? Trocar</span></span></button>
<p class="lock-titulo" id="lgTit"></p><div class="lock-dots" id="lgDots"><span class="lock-dot"></span><span class="lock-dot"></span><span class="lock-dot"></span><span class="lock-dot"></span></div><div class="lock-erro-msg" id="lgErro"></div><div class="lock-teclado" id="lgKb"></div>
<button type="button" class="lock-link" id="lgLink" onclick="lgLinkAcao()">Mudar PIN</button></div></div></div>
<div id="ap" hidden>
<div class="top"><button class="btn" id="bV" onclick="voltar()" hidden>← Picos</button><h1 id="tt">Prospeção</h1><select id="gSel" class="btn" hidden onchange="S.g=this.value;draw()"></select></div>
<div class="tabs"><button class="btn on" id="tT" onclick="tab('todos')">Lista</button><button class="btn" id="tS" onclick="tab('semana')">Semana</button></div>
<div id="vS" hidden><div class="nav"><button class="btn" onclick="sem(-7)">‹</button><b id="sT"></b><button class="btn" onclick="sem(7)">›</button></div><div class="dias" id="ds"></div></div>
<div id="vT"><div class="fil"><input id="q" placeholder="Procurar nome…" oninput="S.q=this.value;S.so='';S.n=50;draw()"><select id="ft" onchange="S.t=this.value;S.n=50;draw()"><option value="">Todos os tipos</option><option>Prospeção</option><option>Reconquista</option><option>Execução Barril</option></select><select id="fc" onchange="S.c=this.value;S.n=50;draw()"></select><select id="fe" onchange="S.e=this.value;S.n=50;draw()"><option value="abertos">Por conquistar</option><option value="">Todos</option><option value="conquistado">Conquistados</option><option value="recusou">Recusaram</option><option value="novavisita">Nova visita</option></select></div></div>
<div class="ed" id="ed"></div><div id="ls"></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwJoWQTZASCbn_nQXDNA3plu-kUa4qwnx24T8Hx2nzjJ8q4jlDFw8HLzd6yQycQlEA/exec";
const Q=new URLSearchParams(location.search),EMB=Q.get('embed')==='1',$=i=>document.getElementById(i);
const U={nome:'',perfil:'',pin:''},S={rows:[],tab:'todos',e:'abertos',seg:'',dia:'',q:'',t:'',c:'',g:'',o:'',so:'',n:50};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const segDe=d=>{d=new Date(d);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,]/g,'').trim();
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mg(a,b){const x=nz(a).split(/\s+/),y=nz(b).split(/\s+/);if(x[0]!==y[0])return false;const l=x[x.length-1],m=y[y.length-1];return l===m||(l.length===1&&m[0]===l)||(m.length===1&&l[0]===m)}
const ROT={tipologia:'Tipologia',segmentacao:'Segmentação',marcaAtual:'Marca atual',marcaConquistar:'Marca a conquistar',prevBarril:'Previsão barril',prevGarrafa:'Previsão garrafa',prevLuso:'Previsão Luso',descontoBarril:'Desconto barril',dataAbordagem:'Data abordagem',contactoNome:'Contacto',contacto:'Telefone',email:'Email',motivo:'Motivo',idSAP:'ID SAP',status:'Status Excel'};
async function post(p){p=Object.assign({utilizador:U.nome,perfil:U.perfil},p);for(let i=0;i<3;i++){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});const d=await r.json();if(d&&d.ok===false&&/ocupado/i.test(d.erro||'')&&i<2){await new Promise(s=>setTimeout(s,800*(i+1)));continue}return d}catch(e){if(i==2)return{ok:false,erro:'sem ligação'};await new Promise(s=>setTimeout(s,800))}}}
function voltar(){if(EMB)parent.postMessage({tipo:'voltar'},location.origin);else if(Q.get('voltar'))location.href=Q.get('voltar')}
const TIT={entrar:'Introduza o PIN para entrar',criar1:'Cria o teu PIN (4 dígitos)',criar2:'Repete o PIN para confirmar',mudar0:'Introduz o PIN atual',mudar1:'Escolhe o novo PIN',mudar2:'Repete o novo PIN',bloqueado:''};
const LG={lista:[],fotos:{},nome:'',modo:'bloqueado',buf:'',tmp:'',atual:'',ocup:false,temPin:false,req:0};
const curto=n=>{const p=String(n).trim().split(/\s+/);return p.length>2?p[0]+' '+p[p.length-1]:p.join(' ')};
const ini=n=>String(n).replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').trim().split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const foto=n=>LG.fotos[n]?'<img src="'+esc(LG.fotos[n])+'" alt="">':ini(n);
function lgGrid(){$('lgGest').innerHTML=LG.lista.map((n,i)=>'<button type="button" class="lock-gestor" onclick="lgEsc('+i+')"><span class="lock-gestor-foto">'+foto(n)+'</span><span class="lock-gestor-nome">'+esc(curto(n))+'</span></button>').join('')}
function lgPasso(p){$('lgPassoG').hidden=p;$('lgPassoP').hidden=!p}
function lgMsg(t){$('lgErro').textContent=t||''}
function lgDots(){[...$('lgDots').children].forEach((d,i)=>d.classList.toggle('cheio',i<LG.buf.length))}
function lgModo(m){LG.modo=m;LG.buf='';lgDots();$('lgTit').textContent=TIT[m]||'';const l=$('lgLink');if(m==='entrar'){l.textContent='Mudar PIN';l.disabled=!LG.temPin}else if(m==='bloqueado'){l.textContent='';l.disabled=true}else{l.textContent='Cancelar';l.disabled=false}}
function lgVoltar(){LG.req++;LG.nome='';LG.ocup=false;lgPasso(false)}
function lgLinkAcao(){if(LG.ocup)return;lgMsg('');LG.tmp=LG.atual='';if(LG.modo==='entrar')lgModo('mudar0');else if(LG.modo.indexOf('mudar')===0)lgModo('entrar');else lgVoltar()}
const KN=(()=>{try{return JSON.parse(localStorage.getItem('prospPin')||'{}')}catch(e){return{}}})();
async function lgEsc(i){const n=LG.lista[i];if(!n)return;if(KN[n]){LG.nome=n;LG.req++;$('lgErroG').textContent='';$('lgFoto').innerHTML=foto(n);$('lgQuem').textContent=curto(n);LG.temPin=true;lgMsg('');lgPasso(true);lgModo('entrar');return}LG.nome=n;$('lgErroG').textContent='';$('lgFoto').innerHTML=foto(n);$('lgQuem').textContent=curto(n);const rq=++LG.req;lgPasso(true);LG.temPin=false;lgMsg('');lgModo('bloqueado');$('lgTit').textContent='A verificar…';LG.ocup=true;
 const r=await post({action:'estado_pin',nome:n});if(rq!==LG.req)return;LG.ocup=false;
 if(r&&r.ok){LG.temPin=!!r.temPin;if(!r.temPin&&r.editor){lgModo('bloqueado');$('lgTit').textContent='PIN do editor por definir';lgMsg('Define-o no script do Google (função definirPinEditor).')}else lgModo(r.temPin?'entrar':'criar1')}
 else{lgVoltar();$('lgErroG').textContent=(r&&r.erro)||'Sem ligação ao servidor. Tenta de novo.'}}
function lgDig(d){if(LG.ocup||LG.modo==='bloqueado'||LG.buf.length>=4)return;lgMsg('');LG.buf+=d;lgDots();if(LG.buf.length===4)setTimeout(lgProc,120)}
function lgApagar(){if(LG.ocup)return;LG.buf=LG.buf.slice(0,-1);lgDots()}
function lgErro(m,prox){const d=$('lgDots');d.classList.add('erro');lgMsg(m);setTimeout(()=>{d.classList.remove('erro');lgModo(prox||LG.modo)},400)}
function lgOk(n,p,perfil){KN[n]=1;try{localStorage.setItem('prospPin',JSON.stringify(KN))}catch(e){}U.nome=n;U.perfil=perfil;U.pin=perfil==='editor'?p:'';iniciar()}
async function lgProc(){const p=LG.buf,m=LG.modo,n=LG.nome;if(p.length!==4||LG.ocup)return;
 if(m==='criar1'){LG.tmp=p;lgModo('criar2');return}
 if(m==='criar2'){if(p!==LG.tmp){LG.tmp='';lgErro('Os PINs não coincidem. Tenta de novo.','criar1');return}LG.ocup=true;$('lgTit').textContent='A guardar…';const r=await post({action:'criar_pin',nome:n,pin:p});LG.ocup=false;LG.tmp='';
  if(r&&r.ok){lgOk(n,p,r.perfil);return}if(r&&r.jaTemPin){LG.temPin=true;lgErro(r.erro,'entrar');return}lgErro((r&&r.erro)||'Não foi possível criar o PIN.','criar1');return}
 if(m==='mudar0'){LG.atual=p;lgModo('mudar1');return}
 if(m==='mudar1'){if(p===LG.atual){lgErro('O novo PIN tem de ser diferente do atual.','mudar1');return}LG.tmp=p;lgModo('mudar2');return}
 if(m==='mudar2'){if(p!==LG.tmp){LG.tmp='';lgErro('Os PINs não coincidem. Tenta de novo.','mudar1');return}LG.ocup=true;$('lgTit').textContent='A guardar…';const r=await post({action:'mudar_pin',nome:n,pinAtual:LG.atual,pinNovo:p});LG.ocup=false;LG.tmp=LG.atual='';
  if(r&&r.ok){lgModo('entrar');lgMsg('PIN alterado. Entra com o novo PIN.');return}lgErro((r&&r.erro)||'Não foi possível mudar o PIN.','mudar0');return}
 LG.ocup=true;$('lgTit').textContent='A verificar…';const r=await post({action:'login',nome:n,pin:p});LG.ocup=false;
 if(r&&r.ok){lgOk(n,p,r.perfil);return}if(r&&r.semPin){LG.temPin=false;lgErro(r.erro,'criar1');return}lgErro((r&&r.erro)||'PIN incorreto.')}
async function iniciar(id){$('lg').hidden=true;$('ap').hidden=false;$('bV').hidden=!(EMB||Q.get('voltar'));S.seg=segDe(new Date());const h=iso(new Date());S.dia=h<=add(S.seg,4)?h:S.seg;S.g=U.nome;
 await carregar();const a=id||Q.get('id');if(a)abrirId(a)}
async function buscar(){try{const r=await fetch(API+'?tipo=prospeccao&t='+Date.now()),d=await r.json();if(d&&d.ok&&d.rows){S.rows=d.rows;try{localStorage.setItem('prospRows',JSON.stringify(d.rows))}catch(e){}return true}}catch(e){}
 const d=await post({action:'prospeccao_ler'});if(d&&d.ok){S.rows=d.rows||[];return true}return false}
async function carregar(){if(S.rows.length)draw();else $('ls').innerHTML='<div class="vz">A carregar…</div>';const ok=await buscar();if(!ok&&!S.rows.length){$('ls').innerHTML='<div class="vz">Não foi possível carregar. Verifica a ligação.</div>';return}draw()}
function abrirId(id){const r=S.rows.find(x=>x.id===id);if(!r)return;if(U.perfil==='editor')S.g=r.gestor;S.tab='todos';S.so=id;S.o=id;S.q='';S.t='';S.c='';draw()}
function tab(t){S.tab=t;S.so='';S.o='';S.n=50;draw()}function sem(n){S.seg=add(S.seg,n);S.dia=S.seg;S.o='';draw()}
function abrir(id){S.o=S.o===id?'':id;draw()}
async function marcar(id,e){const ta=$('n_'+id),d=await post({action:'prospeccao_atualizar',id:id,estado:e,notas:ta?ta.value:undefined});if(!d||!d.ok){alert('Não foi possível guardar: '+((d&&d.erro)||'sem ligação'));return}const i=S.rows.findIndex(r=>r.id===id);if(i>-1)S.rows[i]=d.row;draw()}
function fv(k,v){v=String(v);if(/^\d+\.0$/.test(v))v=v.slice(0,-2);if(/^prev/.test(k)&&/^\d+$/.test(v))return Number(v).toLocaleString('pt-PT');if(k==='descontoBarril'&&/^[0-9.]+$/.test(v)){const p=parseFloat(v);return (p<=1?+(p*100).toFixed(2):p)+'%'}if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v.split('-').reverse().join('/');return v}
function mat(r){const d=r.detalhe||{},T=[['matConjuntos','Conjuntos'],['matChapeus','Chapéus'],['matFrio','Fridge'],['matMesasAltas','Mesas altas'],['matBidon','Bidon'],['matJardim','Jardim vertical']].filter(x=>d[x[0]]);
 const tx=[['matMarca','Marca'],['matCor','Cor'],['matOutros','Outros']].filter(x=>d[x[0]]).map(x=>x[1]+': '+esc(d[x[0]])).join(' · ');
 if(!T.length&&!tx)return '';return '<div class="sec">Material necessário para conquista</div><div class="mt">'+(T.length?'<div class="mg">'+T.map(x=>'<div class="mi"><b>'+esc(fv(x[0],d[x[0]]))+'</b><span>'+x[1]+'</span></div>').join('')+'</div>':'')+(tx?'<div class="mx">'+tx+'</div>':'')+'</div>'}
function card(r){const o=S.o===r.id,tp=r.tipoVisita==='Execução Barril'?'Execução':r.tipoVisita,d=r.detalhe||{},mp='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.nome+' '+r.localidade+' Portugal');
 const pc={quente:'q',morno:'m',frio:'f'}[nz(r.previsao)]||'',id="'"+r.id+"'";
 const kp=(l,v,c)=>'<div class="kp"><span>'+l+'</span><b class="'+(c||'')+'">'+(v?esc(v):'—')+'</b></div>';
 const li=(l,v,h)=>v?'<div class="li"><span>'+l+'</span><b>'+(h||esc(v))+'</b></div>':'';
 const rows=li('Gestor',r.gestor)+li('Tipologia',d.tipologia)+li('Segmentação',d.segmentacao)+li('Marca atual',d.marcaAtual)+li('Marca a conquistar',d.marcaConquistar)+
  li('Previsão garrafa',d.prevGarrafa&&fv('prevGarrafa',d.prevGarrafa))+li('Previsão Luso',d.prevLuso&&fv('prevLuso',d.prevLuso))+li('Data de abordagem',d.dataAbordagem&&fv('dataAbordagem',d.dataAbordagem))+
  li('Planeada para',r.dataPlaneada&&fv('d',r.dataPlaneada))+li('Contacto',d.contactoNome)+li('Telefone',d.contacto,d.contacto&&'<a href="tel:'+esc(fv('contacto',d.contacto))+'">'+esc(fv('contacto',d.contacto))+'</a>')+
  li('Email',d.email,d.email&&'<a href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a>')+li('Motivo',d.motivo)+li('ID SAP',d.idSAP);
 return '<div class="c'+(o?' open':'')+'"><div class="ct" onclick="abrir('+id+')"><div><div class="nm">'+esc(r.nome)+'</div><div class="sb">'+esc(r.localidade)+(r.orla==='Sim'?' · 🌊 orla':'')+'</div></div><div class="col"><span class="bg t-'+tp+'">'+tp+'</span><span class="bg e-'+r.estado+'">'+(r.estado==='novavisita'?'nova visita':r.estado)+'</span></div></div>'+
 '<div class="dt"><div class="kps">'+kp('Previsão',r.previsao,pc)+kp('Barril',d.prevBarril&&fv('prevBarril',d.prevBarril))+kp('Desconto barril',d.descontoBarril&&fv('descontoBarril',d.descontoBarril))+'</div>'+
 '<div class="sec">Dados do estabelecimento</div><div class="ls">'+rows+'</div>'+mat(r)+
 '<textarea id="n_'+r.id+'" rows="2" placeholder="Notas da visita">'+esc(r.notas||'')+'</textarea>'+
 '<div class="ac3"><button class="btn gs" onclick="marcar('+id+',\'conquistado\')">Conquistado</button><button class="btn bl" onclick="marcar('+id+',\'novavisita\')">Nova visita</button><button class="btn am" onclick="marcar('+id+',\'recusou\')">Recusou</button></div>'+
 '<div class="ac"><a class="btn" href="'+mp+'" target="_blank" rel="noopener">📍 Maps</a>'+(r.estado!=='planeada'?'<button class="btn" onclick="marcar('+id+',\'planeada\')">Repor</button>':'')+'</div></div></div>'}
function draw(){const ed=U.perfil==='editor',gs=[...new Set(S.rows.map(r=>r.gestor))].sort(),gsel=$('gSel');
 gsel.hidden=!ed;if(ed){gsel.innerHTML=gs.map(g=>'<option'+(mg(g,S.g)?' selected':'')+'>'+esc(g)+'</option>').join('');}
 const m=S.rows.filter(r=>mg(r.gestor,ed?(gs.find(g=>mg(g,S.g))||S.g):U.nome));
 $('tS').classList.toggle('on',S.tab==='semana');$('tT').classList.toggle('on',S.tab==='todos');$('vS').hidden=S.tab!=='semana';$('vT').hidden=S.tab!=='todos';
 $('ed').innerHTML=ed?'<button class="btn" onclick="gerar()">Gerar semana</button><button class="btn" onclick="$(\'fx\').click()">Importar Excel</button><button class="btn" onclick="exportar()">Descarregar Excel</button><input id="fx" type="file" accept=".xlsx" hidden onchange="importar(this)">':'<button class="btn" onclick="exportar()">Descarregar Excel</button>';
 let l;if(S.tab==='semana'){const d0=new Date(S.seg+'T12:00:00'),d4=new Date(add(S.seg,4)+'T12:00:00'),t=new Date(Date.UTC(d0.getFullYear(),d0.getMonth(),d0.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const w=Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7);
  $('sT').textContent='Semana '+w+' · '+d0.getDate()+'–'+d4.getDate()+'/'+(d4.getMonth()+1);
  $('ds').innerHTML=[0,1,2,3,4].map(i=>{const d=add(S.seg,i);return '<button class="dia'+(d===S.dia?' on':'')+'" onclick="S.dia=\''+d+'\';S.o=\'\';draw()">'+['Seg','Ter','Qua','Qui','Sex'][i]+'<small>'+m.filter(r=>r.dataPlaneada===d).length+' visitas</small></button>'}).join('');
  l=m.filter(r=>r.dataPlaneada===S.dia);$('ls').innerHTML=l.length?l.map(card).join(''):'<div class="vz">Sem visitas neste dia.'+(m.some(r=>r.dataPlaneada>=S.seg&&r.dataPlaneada<=add(S.seg,4))?'':' A semana ainda não foi gerada.')+'</div>'}
 else{const cs=[...new Set(m.map(r=>r.localidade))].sort();$('fc').innerHTML='<option value="">Todas as cidades</option>'+cs.map(c=>'<option'+(c===S.c?' selected':'')+'>'+esc(c)+'</option>').join('');$('q').value=S.q;$('ft').value=S.t;$('fe').value=S.e;
  l=S.so?m.filter(r=>r.id===S.so):m.filter(r=>(!S.t||r.tipoVisita===S.t)&&(!S.c||r.localidade===S.c)&&(S.e==='abertos'?r.estado!=='conquistado':(!S.e||r.estado===S.e))&&(!S.q||nz(r.nome).includes(nz(S.q)))).sort((a,b)=>a.localidade.localeCompare(b.localidade,'pt')||a.nome.localeCompare(b.nome,'pt'));
  $('ls').innerHTML=(S.so?'<button class="btn" onclick="S.so=\'\';S.o=\'\';draw()">Ver todos</button>':'<div class="sb">'+l.length+' estabelecimentos</div>')+l.slice(0,S.n).map(card).join('')+(l.length>S.n?'<button class="btn" style="width:100%" onclick="S.n+=50;draw()">Mostrar mais</button>':'')}}
$('gSel').onchange=function(){S.g=this.value;S.o='';draw()};
async function gerar(){if(!confirm('Gerar o plano da semana '+S.seg+' para todos os gestores?'))return;const d=await post({action:'prospeccao_gerar',segunda:S.seg,pinEditor:U.pin});if(!d||!d.ok){alert('Erro: '+((d&&d.erro)||'sem ligação'));return}carregar()}
function xl(){return window.XLSX?Promise.resolve():new Promise((ok,er)=>{const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';t.onload=ok;t.onerror=er;document.head.appendChild(t)})}
async function importar(i){if(!i.files[0])return;await xl();const wb=XLSX.read(await i.files[0].arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
 if(!rows.length||!rows[0].id||!rows[0].nome){alert('Ficheiro inválido: usa o prospecao_limpo.xlsx.');return}if(!confirm('Importar '+rows.length+' estabelecimentos? As marcações dos gestores mantêm-se.'))return;
 const d=await post({action:'prospeccao_importar',rows:rows,pinEditor:U.pin});if(!d||!d.ok){alert('Erro: '+((d&&d.erro)||'sem ligação'));return}i.value='';carregar()}
async function exportar(){await xl();const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.rows.map(r=>Object.assign({},r,r.detalhe,{detalhe:undefined}))),'Prospeção');XLSX.writeFile(wb,'prospecao_'+iso(new Date())+'.xlsx')}
(async function(){
 if(EMB){window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(m.tipo==='sessao'){U.nome=m.utilizador;U.perfil=m.perfil;U.pin=m.pinEditor||'';if(m.rows&&m.rows.length)S.rows=m.rows;iniciar(m.id)}});parent.postMessage({tipo:'pronto'},location.origin);return}
 $('lgKb').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" class="lock-tecla" onclick="lgDig(\''+n+'\')">'+n+'</button>').join('')+'<button type="button" class="lock-tecla vazia" tabindex="-1" aria-hidden="true"></button><button type="button" class="lock-tecla" onclick="lgDig(\'0\')">0</button><button type="button" class="lock-tecla apagar" onclick="lgApagar()" aria-label="Apagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><line x1="12" y1="9" x2="18" y2="15"/><line x1="18" y1="9" x2="12" y2="15"/></svg></button>';
 $('lg').hidden=false;document.addEventListener('keydown',e=>{if($('lg').hidden||$('lgPassoP').hidden)return;if(/^\d$/.test(e.key))lgDig(e.key);else if(e.key==='Backspace')lgApagar()});
 try{const c=JSON.parse(localStorage.getItem('prospCfg')||'null');if(c&&c.l){LG.lista=c.l;LG.fotos=c.f||{};lgGrid()}}catch(e){}
 try{S.rows=JSON.parse(localStorage.getItem('prospRows')||'[]')}catch(e){}
 buscar();
 try{const r=await fetch(API+'?tipo=gestores&t='+Date.now()),d=await r.json();if(d&&d.listaGestores){LG.lista=d.listaGestores;LG.fotos=d.fotosPessoas||{};lgGrid();try{localStorage.setItem('prospCfg',JSON.stringify({l:LG.lista,f:LG.fotos}))}catch(e){}}}catch(e){if(!LG.lista.length)$('lgErroG').textContent='Sem ligação ao servidor.'}
 })();
</script></body></html>
